<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>David - Gestor de Proyectos</title>

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎸</text></svg>">

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Oculta la barra de scroll pero mantiene el desplazamiento -->
    <style>
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCZsiOVc-wq6tDl3mHDVwo6nTRhx25-Qw8",
          authDomain: "musiquitos-e7351.firebaseapp.com",
          projectId: "musiquitos-e7351",
          storageBucket: "musiquitos-e7351.firebasestorage.app",
          messagingSenderId: "155903440836",
          appId: "1:155903440836:web:f2f1faeb2afaa741d29691"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Proyecto activo según la URL (?app=musiquitos, ?app=garaje, etc. Por defecto: musiquitos)
        const urlParams = new URLSearchParams(window.location.search);
        const currentAppId = urlParams.get('app') || 'musiquitos';

        // Colección principal "David" -> Documento del proyecto activo
        const docRef = doc(db, "David", currentAppId);

        const ADMIN_PIN_HASH = "14a995516254907ded5af55c8314b53b6557c894e9f36e961e6c1c8c3889452a";
        const DEFAULT_AVATAR = "👾";

        async function sha256Hex(text) {
            const data = new TextEncoder().encode(text);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Evita que un nombre/título con caracteres especiales (< > " ') rompa el HTML generado
        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // Da formato a un importe numérico como "20 €" o "45,50 €"
        function hasAmount(h) {
            return h.amount !== undefined && h.amount !== null && h.amount !== '';
        }
        function formatAmount(amount) {
            const num = Number(amount);
            if (isNaN(num)) return '';
            const formatted = Number.isInteger(num) ? String(num) : num.toFixed(2).replace('.', ',');
            return `${formatted}€`;
        }

        // Plantillas iniciales automáticas solo por si el proyecto es completamente nuevo en Firebase
        const appPresets = {
            musiquitos: {
                appName: "Musiquitos",
                icon: "🎸",
                users: [
                    { name: "David", avatar: DEFAULT_AVATAR, history: [{ title: "Enero", paid: true, paidAt: "15/01/2026" }, { title: "Febrero", paid: false, paidAt: "" }] },
                    { name: "Amigo 1", avatar: DEFAULT_AVATAR, history: [{ title: "Enero", paid: false, paidAt: "" }, { title: "Febrero", paid: false, paidAt: "" }] }
                ]
            },
            garaje: {
                appName: "Plaza de Garaje",
                icon: "🚗",
                users: [
                    { name: "Inquilino 1", avatar: "🚗", history: [{ title: "Enero", paid: true, paidAt: "01/01/2026" }, { title: "Febrero", paid: true, paidAt: "01/02/2026" }] }
                ]
            },
            salud: {
                appName: "Historial de Salud",
                icon: "🏥",
                users: [
                    { name: "David", avatar: "🩺", history: [{ title: "Revisión Anual", paid: true, paidAt: "10/05/2026" }] }
                ]
            }
        };

        let currentDb = appPresets[currentAppId] || {
            appName: currentAppId.charAt(0).toUpperCase() + currentAppId.slice(1),
            icon: "📋",
            users: []
        };

        // Si ya se accedió antes como admin en este mismo navegador/móvil, se restaura sin pedir el PIN de nuevo
        let isAdmin = localStorage.getItem('adminSession') === 'true';
        let selectedUserIndex = null;

        // --- MANEJO DE FECHAS Y CALENDARIO ---
        function getTodayYMD() {
            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const yyyy = today.getFullYear();
            return `${yyyy}-${mm}-${dd}`;
        }

        function parseToYMD(dmy) {
            if (!dmy) return getTodayYMD();
            const parts = dmy.split('/');
            if (parts.length === 3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
            return getTodayYMD();
        }

        function parseToDMY(ymd) {
            if (!ymd) return "";
            const parts = ymd.split('-');
            if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
            return ymd;
        }

        // --- CONEXIÓN Y SINCRONIZACIÓN CON FIREBASE (SEGURA CONTRA SOBREESCRITURAS) ---
        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                // Si el documento ya existe en Firebase, cargamos los datos reales de la BDD
                currentDb = docSnap.data();
            } else {
                // Solo si no existe se inicializa con el preset por primera vez
                setDoc(docRef, currentDb);
            }
            render();
        });

        window.saveDataToFirebase = async function() {
            try {
                await setDoc(docRef, currentDb);
            } catch (e) {
                console.error("Error al guardar en Firebase:", e);
            }
        };

        // --- MODO ADMINISTRADOR Y NAVEGACIÓN ENTRE PROYECTOS ---
        window.handleAdminAccess = async function() {
            if (!isAdmin) {
                const pin = prompt("Introduce el PIN de Administrador:");
                if (pin === null) return;
                const pinHash = await sha256Hex(pin);
                if (pinHash === ADMIN_PIN_HASH) {
                    isAdmin = true;
                    localStorage.setItem('adminSession', 'true');
                } else {
                    alert("PIN incorrecto.");
                }
            } else {
                isAdmin = false;
                selectedUserIndex = null;
                localStorage.removeItem('adminSession');
            }
            render();
        };

        window.launchNewProject = function() {
            const nameInput = document.getElementById('new-project-id').value.trim();
            if (!nameInput) return;
            const cleanId = nameInput.toLowerCase().replace(/[^a-z0-9]/g, '-');
            window.location.href = `?app=${cleanId}`;
        };

        window.addGlobalCycle = function() {
            const input = document.getElementById('cycle-name');
            const amountInput = document.getElementById('cycle-amount');
            if (!input.value.trim()) return;
            const amount = amountInput.value.trim() !== '' ? Number(amountInput.value) : '';
            currentDb.users.forEach(u => u.history.push({ title: input.value.trim(), paid: false, paidAt: "", amount }));
            input.value = '';
            amountInput.value = '';
            window.saveDataToFirebase();
        };

        window.addUser = function() {
            const input = document.getElementById('new-user-name');
            if (!input.value.trim()) return;
            const cycles = currentDb.users.length > 0 ? currentDb.users[0].history.map(h => ({ title: h.title, paid: false, paidAt: "" })) : [];
            currentDb.users.push({ name: input.value.trim(), avatar: DEFAULT_AVATAR, history: cycles });
            input.value = '';
            window.saveDataToFirebase();
        };

        window.backupData = function() {
            const dataStr = JSON.stringify(currentDb, null, 2);
            const email = "davidenpelotas@hotmail.com";
            const subject = encodeURIComponent(`Backup ${currentDb.appName || 'Proyecto'}`);
            const body = encodeURIComponent("Copia de seguridad de los datos:\n\n" + dataStr);
            window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
        };

        function triggerDownload(content, mimeType, filename) {
            const blob = new Blob([content], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Descarga el JSON completo tal cual se guarda en Firebase (para backup/restauración)
        window.downloadJSON = function() {
            const dataStr = JSON.stringify(currentDb, null, 2);
            triggerDownload(dataStr, 'application/json', `${currentDb.appName || 'backup'}-${getTodayYMD()}.json`);
        };

        // Exporta una tabla plana (una fila por período de cada persona) para abrir en Excel/Sheets
        function csvEscape(value) {
            const str = String(value ?? '');
            if (/[";\n]/.test(str)) return '"' + str.replace(/"/g, '""') + '"';
            return str;
        }

        window.downloadCSV = function() {
            const rows = [['Elemento/Persona', 'Periodo', 'Estado', 'Fecha de pago', 'Importe']];
            currentDb.users.forEach(user => {
                (user.history.length ? user.history : [{ title: '', paid: false, paidAt: '' }]).forEach(h => {
                    rows.push([user.name, h.title, h.paid ? 'Pagado' : 'Pendiente', h.paidAt || '', hasAmount(h) ? h.amount : '']);
                });
            });
            // Separador ";" y BOM UTF-8 para que Excel en español lo abra ya en columnas y con tildes correctas
            const csvContent = '\uFEFF' + rows.map(r => r.map(csvEscape).join(';')).join('\n');
            triggerDownload(csvContent, 'text/csv;charset=utf-8;', `${currentDb.appName || 'datos'}-${getTodayYMD()}.csv`);
        };

        // Adjunta el backup como archivo real usando el panel nativo de "compartir" del dispositivo
        // (así se puede elegir Gmail/Correo/WhatsApp... y el archivo va como adjunto de verdad, no como texto)
        window.shareBackup = async function() {
            const dataStr = JSON.stringify(currentDb, null, 2);
            const filename = `${currentDb.appName || 'backup'}-${getTodayYMD()}.json`;
            const file = new File([dataStr], filename, { type: 'application/json' });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        files: [file],
                        title: `Backup ${currentDb.appName || 'Proyecto'}`,
                        text: 'Copia de seguridad de los datos'
                    });
                } catch (e) {
                    if (e.name !== 'AbortError') {
                        triggerDownload(dataStr, 'application/json', filename);
                    }
                }
            } else {
                alert('Este navegador no permite adjuntar el archivo directamente. Se descargará: adjúntalo a mano en tu email.');
                triggerDownload(dataStr, 'application/json', filename);
            }
        };

        window.selectUser = function(idx) {
            selectedUserIndex = idx;
            render();
        };

        window.updateUserHeader = function(idx) {
            currentDb.users[idx].name = document.getElementById(`edit-name-${idx}`).value;
            currentDb.users[idx].avatar = document.getElementById(`edit-img-${idx}`).value;
            window.saveDataToFirebase();
        };

        window.updateBlock = function(uIdx, hIdx) {
            const newTitle = document.getElementById(`edit-title-${uIdx}-${hIdx}`).value;
            const newDateYMD = document.getElementById(`edit-date-${uIdx}-${hIdx}`).value;
            const newAmountRaw = document.getElementById(`edit-amount-${uIdx}-${hIdx}`).value;
            currentDb.users[uIdx].history[hIdx].title = newTitle;
            currentDb.users[uIdx].history[hIdx].paidAt = parseToDMY(newDateYMD);
            currentDb.users[uIdx].history[hIdx].amount = newAmountRaw.trim() !== '' ? Number(newAmountRaw) : '';
            window.saveDataToFirebase();
        };

        window.togglePayment = function(uIdx, hIdx) {
            const item = currentDb.users[uIdx].history[hIdx];
            item.paid = !item.paid;
            if (item.paid && !item.paidAt) {
                const today = new Date();
                const dd = String(today.getDate()).padStart(2, '0');
                const mm = String(today.getMonth() + 1).padStart(2, '0');
                const yyyy = today.getFullYear();
                item.paidAt = `${dd}/${mm}/${yyyy}`;
            }
            window.saveDataToFirebase();
        };

        window.deleteBlock = function(uIdx, hIdx) {
            currentDb.users[uIdx].history.splice(hIdx, 1);
            window.saveDataToFirebase();
        };

        window.triggerImport = function() {
            document.getElementById('import-file-input').click();
        };

        window.handleImportFile = function(event) {
            const file = event.target.files[0];
            event.target.value = ''; // permite volver a elegir el mismo archivo más adelante si hace falta
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                let parsed;
                try {
                    parsed = JSON.parse(e.target.result);
                } catch (err) {
                    alert('No se ha podido leer el archivo. Asegúrate de que es un backup .json exportado desde esta app.');
                    return;
                }
                if (!parsed || !Array.isArray(parsed.users)) {
                    alert('El archivo no tiene el formato esperado (falta la lista de "users").');
                    return;
                }
                const ok = confirm(`Vas a reemplazar TODOS los datos actuales de "${currentDb.appName}" por los del archivo importado.\n\nEsta acción no se puede deshacer. ¿Continuar?`);
                if (!ok) return;

                currentDb = parsed;
                selectedUserIndex = null;
                window.saveDataToFirebase();
                render();
                alert('Datos importados correctamente.');
            };
            reader.readAsText(file);
        };

        // --- RENDERIZADO VISUAL ---
        function render() {
            document.getElementById('header-title').textContent = currentDb.appName || "Proyecto";
            document.getElementById('header-icon').textContent = currentDb.icon || "🎸";

            // Refleja el estado de admin (incluida la sesión restaurada desde localStorage al cargar la página)
            document.getElementById('admin-panel').classList.toggle('hidden', !isAdmin);
            document.getElementById('admin-btn').textContent = isAdmin ? "Cerrar Modo Admin" : "Acceso Admin";

            const container = document.getElementById('users-container');
            container.innerHTML = '';

            currentDb.users.forEach((user, userIdx) => {
                let lastPaidIdx = -1;
                user.history.forEach((h, i) => { if(h.paid) lastPaidIdx = i; });

                const avatarContent = user.avatar || DEFAULT_AVATAR;
                const avatarImgHtml = avatarContent.startsWith('http') || avatarContent.endsWith('.jpg') || avatarContent.endsWith('.png')
                    ? `<img src="${escapeHtml(avatarContent)}" class="w-8 h-8 rounded-full object-cover shadow bg-white ring-2 ring-emerald-500">`
                    : `<span class="text-2xl drop-shadow">${escapeHtml(avatarContent)}</span>`;

                const milestoneNodesHtml = user.history.map((h, i) => {
                    const isAvatarHere = (i === lastPaidIdx) || (lastPaidIdx === -1 && i === 0);

                    if (isAvatarHere) {
                        return `
                        <div class="flex flex-col items-center justify-center min-w-[145px] h-12 relative z-10">
                            <div class="flex items-center justify-center">${avatarImgHtml}</div>
                        </div>`;
                    } else if (h.paid) {
                        return `
                        <div class="flex flex-col items-center justify-center min-w-[145px] h-12 relative z-10">
                            <div class="w-3 h-3 rounded-full bg-emerald-500 ring-4 ring-white shadow-sm"></div>
                        </div>`;
                    } else {
                        return `
                        <div class="flex flex-col items-center justify-center min-w-[145px] h-12 relative z-10">
                            <div class="w-3 h-3 rounded-full bg-slate-300 ring-4 ring-white"></div>
                        </div>`;
                    }
                }).join('');

                const cardsHtml = user.history.map((h) => {
                    const cardBg = h.paid ? 'bg-emerald-100/70 border-emerald-300' : 'bg-slate-100/80 border-slate-200';
                    const titleColor = h.paid ? 'text-emerald-900' : 'text-slate-700';
                    const statusText = h.paid ? 'Pagado' : 'Pendiente';
                    const statusColor = h.paid ? 'text-emerald-700 font-medium' : 'text-slate-400';
                    const dateChip = h.paid && h.paidAt ? `<span class="text-xs text-slate-400 font-mono">${escapeHtml(h.paidAt)}</span>` : '';
                    const amountChip = hasAmount(h) ? `<span class="text-xs text-slate-500 font-mono bg-white/80 border border-slate-200 rounded px-1.5 py-0.5">${escapeHtml(formatAmount(h.amount))}</span>` : '';

                    return `
                    <div class="flex flex-col min-w-[145px] ${cardBg} border rounded-xl overflow-hidden shadow-sm">
                        <div class="px-3 py-2 font-medium text-sm ${titleColor} truncate border-b border-slate-200/50">
                            ${escapeHtml(h.title)}
                        </div>
                        <div class="flex-1 px-3 py-2 flex flex-col justify-center gap-1 bg-white/50">
                            <span class="text-xs ${statusColor}">${statusText}</span>
                            <div class="flex items-center gap-1.5 flex-wrap">${dateChip}${amountChip}</div>
                        </div>
                    </div>`;
                }).join('');

                container.innerHTML += `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 flex flex-col gap-4">
                        <div class="font-medium text-slate-900 text-xl tracking-wide">${escapeHtml(user.name)}</div>
                        <div id="scroll-container-${userIdx}" class="overflow-x-auto w-full scroll-smooth hide-scroll px-1">
                            <div class="flex flex-col min-w-max">
                                <div class="relative flex items-center mb-1">
                                    <div class="absolute left-14 right-14 top-1/2 -translate-y-1/2 h-[2px] bg-slate-200 z-0"></div>
                                    ${milestoneNodesHtml || '<span class="text-sm text-slate-400">Sin datos</span>'}
                                </div>
                                <div class="flex items-center gap-2.5">
                                    ${cardsHtml || '<span class="text-sm text-slate-400">Sin bloques</span>'}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            // Desplaza automáticamente cada línea/tarjetas hasta el bloque más reciente
            setTimeout(() => {
                currentDb.users.forEach((_, idx) => {
                    const elScroll = document.getElementById(`scroll-container-${idx}`);
                    if (elScroll) elScroll.scrollLeft = elScroll.scrollWidth;
                });
            }, 50);

            if (isAdmin) {
                const btnContainer = document.getElementById('user-buttons');
                btnContainer.innerHTML = currentDb.users.map((u, i) => `
                    <button onclick="selectUser(${i})" class="px-3.5 py-2 rounded-lg text-sm font-medium transition ${selectedUserIndex === i ? 'bg-slate-800 text-white' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'}">
                        ${escapeHtml(u.name)}
                    </button>
                `).join('');
                renderUserEditor();
            }
        }

        function renderUserEditor() {
            const editor = document.getElementById('user-editor');
            if (selectedUserIndex === null || !currentDb.users[selectedUserIndex]) {
                editor.classList.add('hidden');
                return;
            }

            editor.classList.remove('hidden');
            const user = currentDb.users[selectedUserIndex];

            const userHeaderHtml = `
                <div class="bg-slate-50 p-4 rounded-lg border border-slate-200 flex flex-wrap gap-3 items-end">
                    <div>
                        <label class="text-sm block font-medium text-slate-600 mb-1">Nombre</label>
                        <input type="text" id="edit-name-${selectedUserIndex}" value="${escapeHtml(user.name)}" class="px-3 py-1.5 rounded-lg border border-slate-300 text-sm w-36 outline-none bg-white">
                    </div>
                    <div class="flex-1 min-w-[160px]">
                        <label class="text-sm block font-medium text-slate-600 mb-1">Avatar (Emoji o URL)</label>
                        <input type="text" id="edit-img-${selectedUserIndex}" value="${escapeHtml(user.avatar || DEFAULT_AVATAR)}" class="px-3 py-1.5 rounded-lg border border-slate-300 text-sm w-full outline-none bg-white">
                    </div>
                    <button onclick="updateUserHeader(${selectedUserIndex})" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-900 transition">Guardar Header</button>
                </div>
            `;

            const blocks = user.history.map((h, hIdx) => `
                <div class="flex flex-wrap items-center justify-between bg-slate-50 p-3 rounded-lg border border-slate-200 gap-2.5 text-sm">
                    <div class="flex gap-2 items-center flex-wrap">
                        <input type="text" id="edit-title-${selectedUserIndex}-${hIdx}" value="${escapeHtml(h.title)}" class="w-24 px-2.5 py-1 rounded-lg border border-slate-300 outline-none bg-white" placeholder="Título">
                        <input type="date" id="edit-date-${selectedUserIndex}-${hIdx}" value="${parseToYMD(h.paidAt)}" class="w-32 px-2 py-1 rounded-lg border border-slate-300 outline-none text-xs bg-white cursor-pointer">
                        <input type="number" step="0.01" id="edit-amount-${selectedUserIndex}-${hIdx}" value="${hasAmount(h) ? h.amount : ''}" placeholder="Importe €" class="w-24 px-2.5 py-1 rounded-lg border border-slate-300 outline-none bg-white">
                        <button onclick="updateBlock(${selectedUserIndex}, ${hIdx})" class="bg-slate-200 text-slate-700 px-3 py-1 rounded-lg text-xs font-medium hover:bg-slate-300 transition">Guardar</button>
                    </div>
                    <div class="flex items-center gap-2.5">
                        <button onclick="togglePayment(${selectedUserIndex}, ${hIdx})" class="px-3 py-1.5 rounded-lg text-xs font-medium transition ${h.paid ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-700'}">
                            ${h.paid ? 'Marcar Pendiente' : 'Marcar Pagado'}
                        </button>
                        <button onclick="deleteBlock(${selectedUserIndex}, ${hIdx})" class="text-rose-500 hover:text-rose-700 text-xs px-1 font-medium">Eliminar</button>
                    </div>
                </div>
            `).join('');

            editor.innerHTML = `
                <h4 class="font-medium text-slate-800 text-base mb-2">Editando: <span class="font-normal text-slate-900">${escapeHtml(user.name)}</span></h4>
                ${userHeaderHtml}
                <div class="space-y-2 mt-3">
                    <h5 class="font-medium text-slate-700 text-sm mb-1.5">Bloques de Pago:</h5>
                    ${blocks || '<p class="text-sm text-slate-400">Sin bloques.</p>'}
                </div>
            `;
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto space-y-5">

        <!-- Enlace discreto a Modo Admin -->
        <div class="flex justify-end px-1">
            <button onclick="handleAdminAccess()" id="admin-btn" class="text-sm font-medium text-slate-400 hover:text-slate-700 transition">
                Acceso Admin
            </button>
        </div>

        <!-- Cabecera principal -->
        <header class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200/80 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <span id="header-icon" class="text-3xl">🎸</span>
                <h1 id="header-title" class="text-3xl font-bold tracking-tight text-slate-900">Musiquitos</h1>
            </div>
        </header>

        <!-- Panel de Administración Oculto -->
        <div id="admin-panel" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-300 space-y-6">
            <div class="flex justify-between items-center border-b pb-3 flex-wrap gap-2">
                <h2 class="text-base font-semibold text-slate-800">⚙️ Panel de Administración</h2>
                <div class="flex flex-wrap gap-2">
                    <button onclick="backupData()" class="bg-slate-100 text-slate-600 hover:bg-slate-200 px-3.5 py-1.5 rounded-lg text-sm font-medium transition">
                        📧 Por email (texto)
                    </button>
                    <button onclick="shareBackup()" class="bg-slate-100 text-slate-600 hover:bg-slate-200 px-3.5 py-1.5 rounded-lg text-sm font-medium transition">
                        📤 Adjuntar y Enviar
                    </button>
                    <button onclick="downloadJSON()" class="bg-slate-100 text-slate-600 hover:bg-slate-200 px-3.5 py-1.5 rounded-lg text-sm font-medium transition">
                        ⬇️ Descargar JSON
                    </button>
                    <button onclick="downloadCSV()" class="bg-slate-100 text-slate-600 hover:bg-slate-200 px-3.5 py-1.5 rounded-lg text-sm font-medium transition">
                        📊 Exportar a Excel (CSV)
                    </button>
                    <button onclick="triggerImport()" class="bg-slate-100 text-slate-600 hover:bg-slate-200 px-3.5 py-1.5 rounded-lg text-sm font-medium transition">
                        📥 Importar Backup
                    </button>
                    <input type="file" id="import-file-input" accept=".json,application/json" class="hidden" onchange="handleImportFile(event)">
                </div>
            </div>

            <!-- DIRECTORIO MAESTRO DE PROYECTOS -->
            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                <h3 class="font-medium text-sm text-slate-600 uppercase tracking-wider">🌐 Mis Proyectos en Firebase (David)</h3>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    <a href="?app=musiquitos" class="p-4 bg-white border border-slate-200 rounded-xl hover:border-slate-400 transition flex items-center gap-2 shadow-sm">
                        <span class="text-2xl">🎸</span>
                        <span class="text-sm font-medium text-slate-800">Musiquitos</span>
                    </a>
                    <a href="?app=garaje" class="p-4 bg-white border border-slate-200 rounded-xl hover:border-slate-400 transition flex items-center gap-2 shadow-sm">
                        <span class="text-2xl">🚗</span>
                        <span class="text-sm font-medium text-slate-800">Garaje</span>
                    </a>
                    <a href="?app=salud" class="p-4 bg-white border border-slate-200 rounded-xl hover:border-slate-400 transition flex items-center gap-2 shadow-sm">
                        <span class="text-2xl">🏥</span>
                        <span class="text-sm font-medium text-slate-800">Salud</span>
                    </a>
                </div>

                <div class="flex gap-2 pt-2 border-t border-slate-200/60">
                    <input type="text" id="new-project-id" placeholder="Nombre para otro proyecto..." class="flex-1 px-3 py-2 text-sm rounded-lg border border-slate-300 outline-none bg-white">
                    <button onclick="launchNewProject()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-900 transition">+ Crear / Abrir</button>
                </div>
            </div>

            <!-- Acciones del proyecto actual -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <h3 class="font-medium text-sm text-slate-700 mb-2">1. Crear Período Global</h3>
                    <div class="flex gap-2 flex-wrap">
                        <input type="text" id="cycle-name" placeholder="Ej: Abril 2026" class="flex-1 min-w-[120px] px-3 py-2 text-sm rounded-lg border border-slate-300 focus:ring-1 focus:ring-slate-400 outline-none bg-white">
                        <input type="number" id="cycle-amount" step="0.01" placeholder="Importe €" class="w-28 px-3 py-2 text-sm rounded-lg border border-slate-300 focus:ring-1 focus:ring-slate-400 outline-none bg-white">
                        <button onclick="addGlobalCycle()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-900 transition">Lanzar</button>
                    </div>
                </div>

                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <h3 class="font-medium text-sm text-slate-700 mb-2">2. Alta de Elemento / Persona</h3>
                    <div class="flex gap-2">
                        <input type="text" id="new-user-name" placeholder="Nombre" class="flex-1 px-3 py-2 text-sm rounded-lg border border-slate-300 focus:ring-1 focus:ring-slate-400 outline-none bg-white">
                        <button onclick="addUser()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-900 transition">Añadir</button>
                    </div>
                </div>
            </div>

            <div>
                <h3 class="font-medium text-sm text-slate-700 mb-2.5">3. Gestionar Historial</h3>
                <div id="user-buttons" class="flex flex-wrap gap-2 mb-4"></div>
                <div id="user-editor" class="hidden bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3"></div>
            </div>
        </div>

        <!-- Lista principal de usuarios/elementos -->
        <div class="space-y-4" id="users-container"></div>
    </div>
</body>
