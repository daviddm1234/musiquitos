<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Pagos - Colección David</title>
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎸</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCZsiOVc-wq6tDl3mHDVwo6nTRhx25-Qw8",
            authDomain: "musiquitos-e7351.firebaseapp.com",
            projectId: "musiquitos-e7351",
            storageBucket: "musiquitos-e7351.firebasestorage.app",
            messagingSenderId: "155903440836",
            appId: "1:155903440836:web:f2f1faeb2afaa741d29691"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- LECTURA DE LA COLECCIÓN "David" ---
        const davidCollectionRef = collection(db, "David");

        const DEFAULT_AVATAR = "👾";
        const ADMIN_PIN = "maumau";
        let isAdmin = localStorage.getItem('adminSession') === 'true';
        let selectedUserIndex = null;
        let activeCategoryId = "musiquitos"; // ID por defecto
        let categoriesList = [];

        function getTodayYMD() {
            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const yyyy = today.getFullYear();
            return `${yyyy}-${mm}-${dd}`;
        }

        function parseToYMD(dmy) {
            if (!dmy) return getTodayYMD();
            const parts = dmy.split('/');
            if (parts.length === 3) return `${parts[2]}-${parts[1]}-${parts[0]}`;
            return getTodayYMD();
        }

        function parseToDMY(ymd) {
            if (!ymd) return "";
            const parts = ymd.split('-');
            if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
            return ymd;
        }

        // Suscripción en tiempo real a la colección "David"
        onSnapshot(davidCollectionRef, (snapshot) => {
            categoriesList = [];
            snapshot.forEach((docSnap) => {
                const data = docSnap.data();
                const docId = docSnap.id;
                // Formatear nombre de categoría
                const catName = data.name || (docId.charAt(0).toUpperCase() + docId.slice(1));
                categoriesList.push({
                    id: docId,
                    name: catName,
                    users: data.users || []
                });
            });

            // Si no hay categoría activa válida, seleccionar la primera disponible
            if (!categoriesList.find(c => c.id === activeCategoryId) && categoriesList.length > 0) {
                activeCategoryId = categoriesList[0].id;
            }

            render();
        });

        // Guarda la categoría activa actual en su documento dentro de "David"
        window.saveActiveCategory = async function() {
            const currentCat = getActiveCat();
            if (!currentCat) return;
            try {
                const targetDocRef = doc(db, "David", currentCat.id);
                await setDoc(targetDocRef, {
                    name: currentCat.name,
                    users: currentCat.users
                }, { merge: true });
            } catch (e) {
                console.error("Error al guardar en Firebase: ", e);
                alert("Error al guardar cambios.");
            }
        };

        window.switchCategory = function(catId) {
            activeCategoryId = catId;
            selectedUserIndex = null;
            render();
        };

        window.addCategory = async function() {
            const input = document.getElementById('new-cat-name');
            if (!input.value.trim()) return;
            const catName = input.value.trim();
            const catId = catName.toLowerCase().replace(/\s+/g, '-');
            
            try {
                const targetDocRef = doc(db, "David", catId);
                await setDoc(targetDocRef, {
                    name: catName,
                    users: []
                });
                activeCategoryId = catId;
                input.value = '';
            } catch (e) {
                console.error("Error al crear categoría: ", e);
            }
        };

        window.handleAdminAccess = function() {
            if (!isAdmin) {
                const pin = prompt("Introduce el PIN de Administrador:");
                if (pin === ADMIN_PIN) {
                    isAdmin = true;
                    localStorage.setItem('adminSession', 'true');
                } else if (pin !== null) {
                    alert("PIN incorrecto.");
                }
            } else {
                isAdmin = false;
                selectedUserIndex = null;
                localStorage.removeItem('adminSession');
            }
            render();
        };

        function getActiveCat() {
            return categoriesList.find(c => c.id === activeCategoryId) || categoriesList[0];
        }

        window.addGlobalCycle = function() {
            const input = document.getElementById('cycle-name');
            if (!input.value.trim()) return;
            const activeCat = getActiveCat();
            if (!activeCat) return;
            activeCat.users.forEach(u => u.history.push({ title: input.value.trim(), paid: false, paidAt: "" }));
            input.value = '';
            window.saveActiveCategory();
        };

        window.addUser = function() {
            const input = document.getElementById('new-user-name');
            if (!input.value.trim()) return;
            const activeCat = getActiveCat();
            if (!activeCat) return;
            const cycles = activeCat.users.length > 0 ? activeCat.users[0].history.map(h => ({ title: h.title, paid: false, paidAt: "" })) : [];
            activeCat.users.push({ name: input.value.trim(), avatar: DEFAULT_AVATAR, history: cycles });
            input.value = '';
            window.saveActiveCategory();
        };

        window.selectUser = function(idx) {
            selectedUserIndex = idx;
            render();
        };

        window.updateUserHeader = function(idx) {
            const activeCat = getActiveCat();
            activeCat.users[idx].name = document.getElementById(`edit-name-${idx}`).value;
            activeCat.users[idx].avatar = document.getElementById(`edit-img-${idx}`).value;
            window.saveActiveCategory();
        };

        window.updateBlockTitle = function(uIdx, hIdx) {
            const activeCat = getActiveCat();
            const newTitle = document.getElementById(`edit-title-${uIdx}-${hIdx}`).value;
            const newDateYMD = document.getElementById(`edit-date-${uIdx}-${hIdx}`).value;
            activeCat.users[uIdx].history[hIdx].title = newTitle;
            activeCat.users[uIdx].history[hIdx].paidAt = parseToDMY(newDateYMD);
            window.saveActiveCategory();
        };

        window.togglePayment = function(uIdx, hIdx) {
            const activeCat = getActiveCat();
            const item = activeCat.users[uIdx].history[hIdx];
            item.paid = !item.paid;
            if (item.paid && !item.paidAt) {
                const today = new Date();
                const dd = String(today.getDate()).padStart(2, '0');
                const mm = String(today.getMonth() + 1).padStart(2, '0');
                const yyyy = today.getFullYear();
                item.paidAt = `${dd}/${mm}/${yyyy}`;
            }
            window.saveActiveCategory();
        };

        window.deleteBlock = function(uIdx, hIdx) {
            const activeCat = getActiveCat();
            activeCat.users[uIdx].history.splice(hIdx, 1);
            window.saveActiveCategory();
        };

        function render() {
            document.getElementById('admin-panel').classList.toggle('hidden', !isAdmin);
            document.getElementById('admin-btn').textContent = isAdmin ? "Cerrar Modo Admin" : "Acceso Admin";

            // Renderizar navegación de pestañas con los documentos de "David"
            const catNav = document.getElementById('category-nav');
            if (categoriesList.length === 0) {
                catNav.innerHTML = `<span class="text-xs text-slate-400">Cargando datos de la colección David...</span>`;
            } else {
                catNav.innerHTML = categoriesList.map(cat => `
                    <button onclick="switchCategory('${cat.id}')" class="px-4 py-2 rounded-xl text-sm font-medium transition ${cat.id === activeCategoryId ? 'bg-slate-900 text-white shadow-sm' : 'bg-white text-slate-600 hover:bg-slate-50 border border-slate-200'}">
                        ${cat.name}
                    </button>
                `).join('');
            }

            const activeCat = getActiveCat();
            if (!activeCat) {
                document.getElementById('current-category-title').textContent = "Buscando datos...";
                document.getElementById('users-container').innerHTML = '';
                return;
            }

            document.getElementById('current-category-title').textContent = activeCat.name;

            const container = document.getElementById('users-container');
            container.innerHTML = '';

            if (activeCat.users.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-slate-400 border border-slate-200">No hay usuarios agregados en este concepto todavía.</div>`;
            }

            activeCat.users.forEach((user, userIdx) => {
                let lastPaidIdx = -1;
                user.history.forEach((h, i) => { if(h.paid) lastPaidIdx = i; });

                const avatarContent = user.avatar || DEFAULT_AVATAR;
                const avatarImgHtml = avatarContent.startsWith('http') || avatarContent.endsWith('.jpg') || avatarContent.endsWith('.png') 
                    ? `<img src="${avatarContent}" class="w-8 h-8 rounded-full object-cover shadow bg-white ring-2 ring-emerald-400">` 
                    : `<span class="text-2xl drop-shadow">${avatarContent}</span>`;

                const milestoneNodesHtml = user.history.map((h, i) => {
                    const isAvatarHere = (i === lastPaidIdx) || (lastPaidIdx === -1 && i === 0);
                    if (isAvatarHere) {
                        return `
                        <div class="flex flex-col items-center justify-center min-w-[115px] h-12 relative z-10">
                            <div class="flex items-center justify-center">${avatarImgHtml}</div>
                        </div>`;
                    } else if (i < lastPaidIdx) {
                        return `
                        <div class="flex flex-col items-center justify-center min-w-[115px] h-12 relative z-10">
                            <div class="w-3 h-3 rounded-full bg-emerald-400 ring-4 ring-white shadow-sm"></div>
                        </div>`;
                    } else {
                        return `
                        <div class="flex flex-col items-center justify-center min-w-[115px] h-12 relative z-10">
                            <div class="w-3 h-3 rounded-full bg-slate-300 ring-4 ring-white"></div>
                        </div>`;
                    }
                }).join('');

                const cardsHtml = user.history.map((h) => {
                    const cardBg = h.paid ? 'bg-emerald-50 border-emerald-200' : 'bg-slate-100/90 border-slate-200';
                    const titleColor = h.paid ? 'text-emerald-900' : 'text-slate-700';
                    const statusText = h.paid ? 'Pagado' : 'Pendiente';
                    const statusColor = h.paid ? 'text-emerald-600 font-medium' : 'text-slate-400';

                    return `
                    <div class="flex flex-col min-w-[115px] h-[84px] ${cardBg} border rounded-xl overflow-hidden shadow-sm">
                        <div class="px-3 py-2 font-medium text-sm ${titleColor} truncate border-b border-slate-200/50">
                            ${h.title}
                        </div>
                        <div class="flex-1 px-3 py-2 flex flex-col justify-center bg-white/60">
                            <span class="text-xs ${statusColor}">${statusText}</span>
                            ${h.paid && h.paidAt ? `<span class="text-xs font-mono mt-0.5 text-emerald-700">${h.paidAt}</span>` : ''}
                        </div>
                    </div>`;
                }).join('');

                container.innerHTML += `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 flex flex-col gap-4">
                        <div class="font-medium text-slate-900 text-xl tracking-wide">${user.name}</div>
                        <div id="scroll-container-${userIdx}" class="overflow-x-auto w-full scroll-smooth hide-scroll px-1">
                            <div class="flex flex-col min-w-max">
                                <div class="relative flex items-center mb-1">
                                    <div class="absolute left-14 right-14 top-1/2 -translate-y-1/2 h-[2px] bg-slate-200 z-0"></div>
                                    ${milestoneNodesHtml || '<span class="text-sm text-slate-400">Sin datos</span>'}
                                </div>
                                <div class="flex items-center gap-2.5">
                                    ${cardsHtml || '<span class="text-sm text-slate-400">Sin bloques</span>'}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            // Auto-scroll al final del slider
            setTimeout(() => {
                if (activeCat && activeCat.users) {
                    activeCat.users.forEach((_, idx) => {
                        const elScroll = document.getElementById(`scroll-container-${idx}`);
                        if (elScroll) elScroll.scrollLeft = elScroll.scrollWidth;
                    });
                }
            }, 50);

            if (isAdmin) {
                const btnContainer = document.getElementById('user-buttons');
                btnContainer.innerHTML = activeCat.users.map((u, i) => `
                    <button onclick="selectUser(${i})" class="px-3.5 py-2 rounded-lg text-sm font-medium transition ${selectedUserIndex === i ? 'bg-slate-800 text-white' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'}">
                        ${u.name}
                    </button>
                `).join('');
                renderUserEditor();
            }
        }

        function renderUserEditor() {
            const editor = document.getElementById('user-editor');
            const activeCat = getActiveCat();
            if (selectedUserIndex === null || !activeCat || !activeCat.users[selectedUserIndex]) {
                editor.classList.add('hidden');
                return;
            }

            editor.classList.remove('hidden');
            const user = activeCat.users[selectedUserIndex];

            const userHeaderHtml = `
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-wrap gap-3 items-end">
                    <div>
                        <label class="text-sm block font-medium text-slate-600 mb-1">Nombre</label>
                        <input type="text" id="edit-name-${selectedUserIndex}" value="${user.name}" class="px-3 py-1.5 rounded-lg border border-slate-300 text-sm w-36 outline-none bg-white">
                    </div>
                    <div class="flex-1 min-w-[160px]">
                        <label class="text-sm block font-medium text-slate-600 mb-1">Avatar (Emoji o URL)</label>
                        <input type="text" id="edit-img-${selectedUserIndex}" value="${user.avatar || DEFAULT_AVATAR}" class="px-3 py-1.5 rounded-lg border border-slate-300 text-sm w-full outline-none bg-white">
                    </div>
                    <button onclick="updateUserHeader(${selectedUserIndex})" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-900 transition">Guardar Header</button>
                </div>
            `;

            const blocks = user.history.map((h, hIdx) => `
                <div class="flex flex-wrap items-center justify-between bg-slate-50 p-3 rounded-xl border border-slate-200 gap-3 text-sm">
                    <div class="flex gap-2 items-center flex-wrap">
                        <input type="text" id="edit-title-${selectedUserIndex}-${hIdx}" value="${h.title}" class="w-24 px-2.5 py-1 rounded-lg border border-slate-300 outline-none bg-white">
                        <input type="date" id="edit-date-${selectedUserIndex}-${hIdx}" value="${parseToYMD(h.paidAt)}" class="w-32 px-2 py-1 rounded-lg border border-slate-300 outline-none text-xs bg-white cursor-pointer">
                        <button onclick="updateBlockTitle(${selectedUserIndex}, ${hIdx})" class="bg-slate-200 text-slate-700 px-3 py-1 rounded-lg text-xs font-medium hover:bg-slate-300 transition">Guardar</button>
                    </div>
                    <div class="flex items-center gap-2.5">
                        <button onclick="togglePayment(${selectedUserIndex}, ${hIdx})" class="px-3 py-1.5 rounded-lg text-xs font-medium transition ${h.paid ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-700'}">
                            ${h.paid ? 'Marcar Pendiente' : 'Marcar Pagado'}
                        </button>
                        <button onclick="deleteBlock(${selectedUserIndex}, ${hIdx})" class="text-rose-500 hover:text-rose-700 text-xs px-1 font-medium">Eliminar</button>
                    </div>
                </div>
            `).join('');

            editor.innerHTML = `
                <h4 class="font-medium text-slate-800 text-base mb-2">Editando: <span class="font-normal text-slate-900">${user.name}</span></h4>
                ${userHeaderHtml}
                <div class="space-y-2 mt-4">
                    <h5 class="font-medium text-slate-700 text-sm mb-1.5">Bloques de Pago:</h5>
                    ${blocks || '<p class="text-sm text-slate-400">Sin bloques.</p>'}
                </div>
            `;
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-900 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-3xl mx-auto space-y-5">
        <div class="flex justify-end px-1">
            <button onclick="handleAdminAccess()" id="admin-btn" class="text-sm font-medium text-slate-400 hover:text-slate-700 transition">
                Acceso Admin
            </button>
        </div>

        <header class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200/80 flex flex-col gap-4">
            <div class="flex items-center justify-between">
                <h1 id="current-category-title" class="text-3xl font-bold tracking-tight text-slate-900">Cargando...</h1>
            </div>
            <!-- Pestañas automáticas desde la colección David -->
            <div id="category-nav" class="flex flex-wrap gap-2.5 pt-3 border-t border-slate-100"></div>
        </header>

        <div id="admin-panel" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-300 space-y-6">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="text-base font-semibold text-slate-800">⚙️ Panel de Administración (Colección David)</h2>
            </div>

            <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-4">
                <h3 class="font-medium text-sm text-slate-700 mb-2">Añadir Nuevo Documento / Servicio a la colección David</h3>
                <div class="flex gap-2.5">
                    <input type="text" id="new-cat-name" placeholder="Ejemplo: Trastero" class="flex-1 px-3 py-2 text-sm rounded-lg border border-slate-300 focus:ring-1 focus:ring-slate-400 outline-none bg-white">
                    <button onclick="addCategory()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-900 transition">Crear Documento</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <h3 class="font-medium text-sm text-slate-700 mb-2">1. Lanzar Período en esta Pestaña</h3>
                    <div class="flex gap-2.5">
                        <input type="text" id="cycle-name" placeholder="Ej: Marzo 2026" class="flex-1 px-3 py-2 text-sm rounded-lg border border-slate-300 focus:ring-1 focus:ring-slate-400 outline-none bg-white">
                        <button onclick="addGlobalCycle()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-900 transition">Lanzar</button>
                    </div>
                </div>

                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <h3 class="font-medium text-sm text-slate-700 mb-2">2. Añadir Persona / Inquilino</h3>
                    <div class="flex gap-2.5">
                        <input type="text" id="new-user-name" placeholder="Nombre" class="flex-1 px-3 py-2 text-sm rounded-lg border border-slate-300 focus:ring-1 focus:ring-slate-400 outline-none bg-white">
                        <button onclick="addUser()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-900 transition">Añadir</button>
                    </div>
                </div>
            </div>

            <div>
                <h3 class="font-medium text-sm text-slate-700 mb-2.5">3. Editar Persona / Pagos</h3>
                <div id="user-buttons" class="flex flex-wrap gap-2 mb-4"></div>
                <div id="user-editor" class="hidden bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3"></div>
            </div>
        </div>

        <div class="space-y-4" id="users-container"></div>
    </div>
</body>
</html>
