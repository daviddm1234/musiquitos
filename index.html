<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Suscripción Grupo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <header class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">💳 Control de Pagos</h1>
                <p class="text-sm text-slate-500">Estado de suscripción compartida</p>
            </div>
            <button onclick="handleAdminAccess()" id="admin-btn" class="bg-slate-900 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-slate-800 transition">
                Acceso Admin
            </button>
        </header>

        <!-- Admin Panel -->
        <div id="admin-panel" class="hidden bg-white rounded-2xl p-6 shadow-md border border-indigo-200 space-y-6">
            <div class="flex justify-between items-center border-b pb-4">
                <h2 class="text-lg font-bold text-indigo-900">🛠️ Panel de Administración</h2>
                <span class="text-xs bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-medium">Modo Edición Activo</span>
            </div>

            <!-- Global Actions -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <h3 class="font-semibold text-sm text-slate-700 mb-2">1. Crear Nuevo Período Global</h3>
                    <div class="flex gap-2">
                        <input type="text" id="cycle-name" placeholder="Ej: Abril 2026 o Q2 3-Meses" class="flex-1 px-3 py-2 text-sm rounded-lg border focus:ring-2 focus:ring-indigo-500 outline-none">
                        <button onclick="addGlobalCycle()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700">Lanzar</button>
                    </div>
                </div>

                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <h3 class="font-semibold text-sm text-slate-700 mb-2">2. Dar de Alta Usuario</h3>
                    <div class="flex gap-2">
                        <input type="text" id="new-user-name" placeholder="Nombre" class="flex-1 px-3 py-2 text-sm rounded-lg border focus:ring-2 focus:ring-indigo-500 outline-none">
                        <button onclick="addUser()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-900">Añadir</button>
                    </div>
                </div>
            </div>

            <!-- User Selector & Edit Area -->
            <div>
                <h3 class="font-semibold text-sm text-slate-700 mb-3">3. Selecciona Usuario para Gestionar Pagos</h3>
                <div id="user-buttons" class="flex flex-wrap gap-2 mb-4"></div>
                <div id="user-editor" class="hidden bg-indigo-50/50 p-4 rounded-xl border border-indigo-100 space-y-3"></div>
            </div>
        </div>

        <!-- Dashboard User List -->
        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-900 mb-4">Estado General</h2>
            <div id="users-container" class="space-y-4"></div>
        </div>
    </div>

    <script>
        const ADMIN_PIN = "1234";
        let isAdmin = false;
        let selectedUserIndex = null;

        let db = JSON.parse(localStorage.getItem('group_pay_db')) || {
            users: [
                { name: "Carlos", history: [{ title: "Marzo", paid: true }, { title: "Abril", paid: false }] },
                { name: "Ana", history: [{ title: "Marzo", paid: true }, { title: "Abril", paid: false }] }
            ]
        };

        function saveData() {
            localStorage.setItem('group_pay_db', JSON.stringify(db));
            render();
        }

        function handleAdminAccess() {
            if (!isAdmin) {
                const pin = prompt("Introduce la contraseña de Administrador:");
                if (pin === ADMIN_PIN) {
                    isAdmin = true;
                    document.getElementById('admin-panel').classList.remove('hidden');
                    document.getElementById('admin-btn').textContent = "Cerrar Admin";
                    document.getElementById('admin-btn').classList.replace('bg-slate-900', 'bg-rose-600');
                } else if (pin !== null) {
                    alert("Contraseña incorrecta.");
                }
            } else {
                isAdmin = false;
                selectedUserIndex = null;
                document.getElementById('admin-panel').classList.add('hidden');
                document.getElementById('admin-btn').textContent = "Acceso Admin";
                document.getElementById('admin-btn').classList.replace('bg-rose-600', 'bg-slate-900');
            }
            render();
        }

        function addGlobalCycle() {
            const input = document.getElementById('cycle-name');
            if (!input.value.trim()) return;
            db.users.forEach(u => u.history.push({ title: input.value.trim(), paid: false }));
            input.value = '';
            saveData();
        }

        function addUser() {
            const input = document.getElementById('new-user-name');
            if (!input.value.trim()) return;
            const cycles = db.users.length > 0 ? db.users[0].history.map(h => ({ title: h.title, paid: false })) : [];
            db.users.push({ name: input.value.trim(), history: cycles });
            input.value = '';
            saveData();
        }

        function togglePayment(uIdx, hIdx) {
            db.users[uIdx].history[hIdx].paid = !db.users[uIdx].history[hIdx].paid;
            saveData();
        }

        function deleteBlock(uIdx, hIdx) {
            db.users[uIdx].history.splice(hIdx, 1);
            saveData();
        }

        function render() {
            // Render Main Users List
            const container = document.getElementById('users-container');
            container.innerHTML = '';

            db.users.forEach((user) => {
                const blocksHtml = user.history.map(h => `
                    <div class="flex flex-col items-center">
                        <div class="px-3 py-1.5 rounded-lg text-xs font-semibold shadow-sm ${h.paid ? 'bg-emerald-500 text-white' : 'bg-purple-100 text-purple-700 border border-purple-200'}">
                            ${h.title}
                        </div>
                        <span class="text-[10px] mt-1 text-slate-400 font-medium">${h.paid ? 'Pagado' : 'Pendiente'}</span>
                    </div>
                `).join('');

                container.innerHTML += `
                    <div class="p-4 rounded-xl border border-slate-100 bg-slate-50/50 flex flex-col md:flex-row md:items-center justify-between gap-4">
                        <div class="font-bold text-slate-800 text-base min-w-[120px]">${user.name}</div>
                        <div class="flex flex-wrap gap-2 items-center flex-1">${blocksHtml || '<span class="text-xs text-slate-400">Sin registros</span>'}</div>
                    </div>
                `;
            });

            // Render Admin Buttons
            if (isAdmin) {
                const btnContainer = document.getElementById('user-buttons');
                btnContainer.innerHTML = db.users.map((u, i) => `
                    <button onclick="selectUser(${i})" class="px-3 py-1.5 rounded-lg text-sm font-medium transition ${selectedUserIndex === i ? 'bg-indigo-600 text-white' : 'bg-white border text-slate-700 hover:bg-slate-100'}">
                        ${u.name}
                    </button>
                `).join('');

                renderUserEditor();
            }
        }

        function selectUser(idx) {
            selectedUserIndex = idx;
            renderUserEditor();
        }

        function renderUserEditor() {
            const editor = document.getElementById('user-editor');
            if (selectedUserIndex === null || !db.users[selectedUserIndex]) {
                editor.classList.add('hidden');
                return;
            }

            editor.classList.remove('hidden');
            const user = db.users[selectedUserIndex];

            const blocks = user.history.map((h, hIdx) => `
                <div class="flex items-center justify-between bg-white p-2.5 rounded-lg border border-slate-200 text-sm">
                    <span class="font-medium text-slate-700">${h.title}</span>
                    <div class="flex items-center gap-2">
                        <button onclick="togglePayment(${selectedUserIndex}, ${hIdx})" class="px-3 py-1 rounded text-xs font-semibold ${h.paid ? 'bg-emerald-100 text-emerald-700' : 'bg-purple-100 text-purple-700'}">
                            ${h.paid ? 'Marcar Pendiente' : 'Marcar Pagado'}
                        </button>
                        <button onclick="deleteBlock(${selectedUserIndex}, ${hIdx})" class="text-rose-500 hover:text-rose-700 text-xs px-2 py-1">Eliminar</button>
                    </div>
                </div>
            `).join('');

            editor.innerHTML = `
                <div class="flex justify-between items-center mb-2">
                    <h4 class="font-bold text-slate-800 text-sm">Gestionando pagos de: <span class="text-indigo-600">${user.name}</span></h4>
                </div>
                <div class="space-y-2">${blocks || '<p class="text-xs text-slate-500">No hay bloques asignados.</p>'}</div>
            `;
        }

        render();
    </script>
</body>
</html>
