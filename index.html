<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musiquitos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configuración de tu proyecto Musiquitos
        const firebaseConfig = {
          apiKey: "AIzaSyCZsiOVc-wq6tDl3mHDVwo6nTRhx25-Qw8",
          authDomain: "musiquitos-e7351.firebaseapp.com",
          projectId: "musiquitos-e7351",
          storageBucket: "musiquitos-e7351.firebasestorage.app",
          messagingSenderId: "155903440836",
          appId: "1:155903440836:web:f2f1faeb2afaa741d29691"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const docRef = doc(db, "suscripcion", "datos_grupo");

        // Avatar por defecto: Macaco tipo Space Invader (👾)
        const DEFAULT_AVATAR = "👾";

        const defaultData = {
            users: [
                { name: "David", avatar: DEFAULT_AVATAR, history: [{ title: "Enero", paid: true }, { title: "Febrero", paid: false }] },
                { name: "Amigo 1", avatar: DEFAULT_AVATAR, history: [{ title: "Enero", paid: false }, { title: "Febrero", paid: false }] }
            ]
        };

        let currentDb = defaultData;
        const ADMIN_PIN = "1234";
        let isAdmin = false;
        let selectedUserIndex = null;

        // Escuchar cambios en tiempo real desde Firebase
        onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                currentDb = docSnap.data();
            } else {
                setDoc(docRef, defaultData);
            }
            render();
        });

        window.saveDataToFirebase = async function() {
            try {
                await setDoc(docRef, currentDb);
            } catch (e) {
                console.error("Error al guardar en Firebase: ", e);
                alert("Hubo un error al guardar los datos.");
            }
        };

        window.handleAdminAccess = function() {
            if (!isAdmin) {
                const pin = prompt("Introduce el PIN de Administrador:");
                if (pin === ADMIN_PIN) {
                    isAdmin = true;
                    document.getElementById('admin-panel').classList.remove('hidden');
                    document.getElementById('admin-btn').textContent = "Cerrar Admin";
                    document.getElementById('admin-btn').classList.replace('bg-slate-900', 'bg-rose-600');
                } else if (pin !== null) {
                    alert("PIN incorrecto.");
                }
            } else {
                isAdmin = false;
                selectedUserIndex = null;
                document.getElementById('admin-panel').classList.add('hidden');
                document.getElementById('admin-btn').textContent = "Modo Admin";
                document.getElementById('admin-btn').classList.replace('bg-rose-600', 'bg-slate-900');
            }
            render();
        };

        window.addGlobalCycle = function() {
            const input = document.getElementById('cycle-name');
            if (!input.value.trim()) return;
            currentDb.users.forEach(u => u.history.push({ title: input.value.trim(), paid: false }));
            input.value = '';
            window.saveDataToFirebase();
        };

        window.addUser = function() {
            const input = document.getElementById('new-user-name');
            if (!input.value.trim()) return;
            const cycles = currentDb.users.length > 0 ? currentDb.users[0].history.map(h => ({ title: h.title, paid: false })) : [];
            currentDb.users.push({ name: input.value.trim(), avatar: DEFAULT_AVATAR, history: cycles });
            input.value = '';
            window.saveDataToFirebase();
        };

        window.backupData = function() {
            const dataStr = JSON.stringify(currentDb, null, 2);
            const email = "davidenpelotas@hotmail.com";
            const subject = encodeURIComponent("Backup Musiquitos");
            const body = encodeURIComponent("Copia de seguridad de los datos de pago:\n\n" + dataStr);
            window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
        };

        window.selectUser = function(idx) {
            selectedUserIndex = idx;
            render();
        };

        window.updateUserHeader = function(idx) {
            currentDb.users[idx].name = document.getElementById(`edit-name-${idx}`).value;
            currentDb.users[idx].avatar = document.getElementById(`edit-img-${idx}`).value;
            window.saveDataToFirebase();
        };

        window.updateBlockTitle = function(uIdx, hIdx) {
            const newTitle = document.getElementById(`edit-title-${uIdx}-${hIdx}`).value;
            currentDb.users[uIdx].history[hIdx].title = newTitle;
            window.saveDataToFirebase();
        };

        window.togglePayment = function(uIdx, hIdx) {
            currentDb.users[uIdx].history[hIdx].paid = !currentDb.users[uIdx].history[hIdx].paid;
            window.saveDataToFirebase();
        };

        window.deleteBlock = function(uIdx, hIdx) {
            currentDb.users[uIdx].history.splice(hIdx, 1);
            window.saveDataToFirebase();
        };

        function render() {
            const container = document.getElementById('users-container');
            container.innerHTML = '';

            currentDb.users.forEach((user) => {
                let lastPaidIdx = -1;
                user.history.forEach((h, i) => { if(h.paid) lastPaidIdx = i; });

                const blocksHtml = user.history.map((h, i) => {
                    // Si no ha pagado nada, el avatar se coloca en el primer bloque (índice 0)
                    const isAvatarHere = (i === lastPaidIdx) || (lastPaidIdx === -1 && i === 0);
                    const blockColor = h.paid ? 'bg-emerald-100 text-emerald-900' : 'bg-purple-100 text-purple-900';
                    const blockBorder = h.paid ? 'border-emerald-200' : 'border-purple-200';
                    const avatarContent = user.avatar || DEFAULT_AVATAR;

                    const avatarHtml = avatarContent.startsWith('http') || avatarContent.endsWith('.jpg') || avatarContent.endsWith('.png')
                        ? `<img src="${avatarContent}" class="w-12 h-12 rounded-full border-2 border-white absolute top-0 z-10 object-cover bg-slate-900 shadow-md">`
                        : `<div class="w-12 h-12 rounded-full border-2 border-white absolute top-0 z-10 flex items-center justify-center bg-slate-900 text-white text-xl shadow-md">${avatarContent}</div>`;
                    
                    return `
                    <div class="flex flex-col items-center justify-end min-w-[110px] h-[140px] relative px-1">
                        ${isAvatarHere ? avatarHtml : ''}
                        <div class="w-full h-14 ${blockColor} border-2 ${blockBorder} rounded-xl flex items-center justify-center text-sm font-semibold px-2 truncate relative shadow-sm">
                            ${h.title}
                            ${!h.paid ? '<div class="absolute inset-0 bg-black opacity-5 rounded-xl"></div>' : ''}
                        </div>
                    </div>`;
                }).join('');

                container.innerHTML += `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col md:flex-row gap-5 items-center">
                        <div class="font-bold text-slate-800 text-lg min-w-[140px]">${user.name}</div>
                        <div class="flex-1 overflow-x-auto w-full pb-2">
                            <div class="flex items-end border-b-2 border-slate-200 pb-2 min-w-max px-2">
                                ${blocksHtml || '<span class="text-sm text-slate-400 h-14 flex items-center">Sin bloques generados</span>'}
                            </div>
                        </div>
                    </div>
                `;
            });

            if (isAdmin) {
                const btnContainer = document.getElementById('user-buttons');
                btnContainer.innerHTML = currentDb.users.map((u, i) => `
                    <button onclick="selectUser(${i})" class="px-4 py-2 rounded-xl text-sm font-medium transition ${selectedUserIndex === i ? 'bg-indigo-600 text-white' : 'bg-white border border-slate-200 text-slate-700 hover:bg-slate-50'}">
                        ${u.name}
                    </button>
                `).join('');
                renderUserEditor();
            }
        }

        function renderUserEditor() {
            const editor = document.getElementById('user-editor');
            if (selectedUserIndex === null || !currentDb.users[selectedUserIndex]) {
                editor.classList.add('hidden');
                return;
            }

            editor.classList.remove('hidden');
            const user = currentDb.users[selectedUserIndex];

            const userHeaderHtml = `
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex flex-wrap gap-3 items-end">
                    <div>
                        <label class="text-xs block font-bold text-slate-600 mb-1">Nombre</label>
                        <input type="text" id="edit-name-${selectedUserIndex}" value="${user.name}" class="px-3 py-1.5 rounded-lg border border-slate-300 text-sm w-36 outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div class="flex-1 min-w-[150px]">
                        <label class="text-xs block font-bold text-slate-600 mb-1">Avatar (Emoji o nombre de imagen)</label>
                        <input type="text" id="edit-img-${selectedUserIndex}" value="${user.avatar || DEFAULT_AVATAR}" class="px-3 py-1.5 rounded-lg border border-slate-300 text-sm w-full outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <button onclick="updateUserHeader(${selectedUserIndex})" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-indigo-700 transition">Guardar</button>
                </div>
            `;

            const blocks = user.history.map((h, hIdx) => `
                <div class="flex flex-wrap items-center justify-between bg-slate-50 p-3 rounded-lg border border-slate-200 gap-3 text-sm">
                    <div class="flex gap-2 items-center">
                        <input type="text" id="edit-title-${selectedUserIndex}-${hIdx}" value="${h.title}" class="w-28 px-2 py-1 rounded border border-slate-300 outline-none">
                        <button onclick="updateBlockTitle(${selectedUserIndex}, ${hIdx})" class="bg-amber-100 text-amber-800 px-2.5 py-1 rounded text-xs font-semibold hover:bg-amber-200 transition">Renombrar</button>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="togglePayment(${selectedUserIndex}, ${hIdx})" class="px-3 py-1 rounded text-xs font-semibold transition ${h.paid ? 'bg-emerald-100 text-emerald-700' : 'bg-purple-100 text-purple-700'}">
                            ${h.paid ? 'Marcar Pendiente' : 'Marcar Pagado'}
                        </button>
                        <button onclick="deleteBlock(${selectedUserIndex}, ${hIdx})" class="text-rose-500 hover:text-rose-700 text-xs px-2 py-1 font-semibold">Eliminar</button>
                    </div>
                </div>
            `).join('');

            editor.innerHTML = `
                <h4 class="font-bold text-slate-800 text-base mb-3">Editando a: <span class="text-indigo-600">${user.name}</span></h4>
                ${userHeaderHtml}
                <div class="space-y-2 mt-4">
                    <h5 class="font-bold text-slate-700 text-sm mb-2">Bloques de Pago:</h5>
                    ${blocks || '<p class="text-xs text-slate-500">Sin bloques.</p>'}
                </div>
            `;
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <!-- Header -->
        <header class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="text-3xl">🎵</span>
                <h1 class="text-2xl font-bold text-slate-900">Musiquitos</h1>
            </div>
            <button onclick="handleAdminAccess()" id="admin-btn" class="bg-slate-900 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-slate-800 transition">
                Modo Admin
            </button>
        </header>

        <!-- Admin Panel -->
        <div id="admin-panel" class="hidden bg-white p-6 rounded-2xl shadow-md border border-indigo-200 space-y-6">
            <div class="flex justify-between items-center border-b pb-4">
                <h2 class="text-lg font-bold text-indigo-900">🛠️ Panel de Administración</h2>
                <button onclick="backupData()" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-medium hover:bg-blue-700 transition">
                    📧 Enviar Backup
                </button>
            </div>

            <!-- Global Actions -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <h3 class="font-semibold text-sm text-slate-700 mb-2">1. Crear Nuevo Período Global</h3>
                    <div class="flex gap-2">
                        <input type="text" id="cycle-name" placeholder="Ej: Abril 2026" class="flex-1 px-3 py-2 text-sm rounded-lg border focus:ring-2 focus:ring-indigo-500 outline-none">
                        <button onclick="addGlobalCycle()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">Lanzar</button>
                    </div>
                </div>

                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <h3 class="font-semibold text-sm text-slate-700 mb-2">2. Dar de Alta Usuario</h3>
                    <div class="flex gap-2">
                        <input type="text" id="new-user-name" placeholder="Nombre" class="flex-1 px-3 py-2 text-sm rounded-lg border focus:ring-2 focus:ring-indigo-500 outline-none">
                        <button onclick="addUser()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-900 transition">Añadir</button>
                    </div>
                </div>
            </div>

            <!-- User Selector & Edit Area -->
            <div>
                <h3 class="font-semibold text-sm text-slate-700 mb-3">3. Selecciona Usuario para Gestionar Pagos</h3>
                <div id="user-buttons" class="flex flex-wrap gap-2 mb-4"></div>
                <div id="user-editor" class="hidden bg-indigo-50/50 p-4 rounded-xl border border-indigo-100 space-y-3"></div>
            </div>
        </div>

        <!-- Dashboard User List -->
        <div class="space-y-4" id="users-container"></div>
    </div>
</body>
</html>
